<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>ULTRA AI GOD MODE</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="auth" class="auth hidden"></div>

<div id="app" class="layout hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><img src="icon.svg" alt=""><div><b>ULTRA AI</b><small>GOD MODE</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span id="version"></span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="menu">☰</button>
      <h1 id="pageTitle"></h1>
      <div class="top-actions">
        <span id="conn" class="conn"><i></i><span></span></span>
        <button class="icon-btn" id="langBtn" title="Language">EN</button>
        <button class="icon-btn" id="themeBtn" title="Theme">☀</button>
        <button class="emergency" id="emergencyBtn"></button>
      </div>
    </header>
    <div id="banner" class="banner hidden"></div>
    <main id="page" class="page"></main>
  </div>
</div>

<div id="drawer" class="drawer hidden"><div class="drawer-panel"><button class="icon-btn close" id="drawerClose">✕</button><div id="drawerBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
